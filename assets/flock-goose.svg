<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEFCF7"/>
      <stop offset="100%" stop-color="#F0E8D8"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9B233"/>
      <stop offset="100%" stop-color="#E8971A"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9B233"/>
      <stop offset="100%" stop-color="#D4880F"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="305" rx="65" ry="10" fill="#00000010"/>

  <!-- Left foot -->
  <path d="M115 290 L100 298 L108 302 L96 308 L115 300 L122 305 L115 290Z" fill="url(#legGrad)" stroke="#C47A0A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right foot -->
  <path d="M175 290 L190 298 L182 302 L194 308 L175 300 L168 305 L175 290Z" fill="url(#legGrad)" stroke="#C47A0A" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Left leg -->
  <path d="M125 258 Q120 275 118 290" stroke="#E8971A" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Right leg -->
  <path d="M165 258 Q170 275 172 290" stroke="#E8971A" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Tail -->
  <path d="M195 175 Q225 155 220 140 Q230 150 235 138 Q232 158 215 175Z" fill="#E8DFC8" stroke="#C4B896" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Body -->
  <ellipse cx="150" cy="210" rx="70" ry="60" fill="url(#bodyGrad)" stroke="#D4C9A8" stroke-width="2"/>

  <!-- Wing -->
  <path d="M95 190 Q75 210 82 240 Q95 255 115 245 Q130 230 125 210 Q120 195 95 190Z" fill="#EDE5D0" stroke="#C4B896" stroke-width="1.8"/>
  <!-- Wing detail lines -->
  <path d="M92 205 Q100 215 98 230" fill="none" stroke="#C4B896" stroke-width="1" opacity="0.6"/>
  <path d="M100 200 Q108 212 105 225" fill="none" stroke="#C4B896" stroke-width="1" opacity="0.6"/>

  <!-- Neck -->
  <path d="M155 165 Q152 130 148 105 Q145 80 140 60 Q138 50 142 42" fill="url(#bodyGrad)" stroke="#D4C9A8" stroke-width="2"/>
  <path d="M175 170 Q172 135 168 108 Q165 85 162 65 Q160 52 163 44" fill="url(#bodyGrad)" stroke="#D4C9A8" stroke-width="2"/>
  <!-- Neck fill -->
  <path d="M155 165 Q152 130 148 105 Q145 80 140 60 Q138 50 142 42 L163 44 Q160 52 162 65 Q165 85 168 108 Q172 135 175 170Z" fill="url(#bodyGrad)"/>

  <!-- Head -->
  <ellipse cx="152" cy="38" rx="24" ry="20" fill="url(#bodyGrad)" stroke="#D4C9A8" stroke-width="2"/>

  <!-- Beak top -->
  <path d="M130 35 L105 30 Q100 34 105 38 L130 40" fill="url(#beakGrad)" stroke="#C47A0A" stroke-width="1.5"/>
  <!-- Beak bottom (slightly open - happy!) -->
  <path d="M130 40 L110 42 Q108 44 110 45 L130 43" fill="#E8971A" stroke="#C47A0A" stroke-width="1.2"/>
  <!-- Nostril -->
  <ellipse cx="115" cy="34" rx="2" ry="1.5" fill="#C47A0A" opacity="0.5"/>

  <!-- Eye white -->
  <ellipse cx="143" cy="33" rx="8" ry="8.5" fill="white" stroke="#D4C9A8" stroke-width="1"/>
  <!-- Iris -->
  <circle cx="141" cy="33" r="5.5" fill="#2D2926"/>
  <!-- Pupil highlight -->
  <circle cx="139" cy="31" r="2" fill="white"/>
  <!-- Small secondary highlight -->
  <circle cx="143" cy="35" r="0.8" fill="white" opacity="0.6"/>

  <!-- Eyebrow (friendly arch) -->
  <path d="M134 23 Q143 19 152 23" fill="none" stroke="#B0A480" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="133" cy="43" rx="6" ry="3.5" fill="#FFB4B4" opacity="0.35"/>

  <!-- Tuft on head -->
  <path d="M160 20 Q165 10 162 5" fill="none" stroke="#D4C9A8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M155 19 Q157 8 152 3" fill="none" stroke="#D4C9A8" stroke-width="2" stroke-linecap="round"/>

</svg>