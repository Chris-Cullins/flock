[workspace]
members = [
  "crates/fl-storage",
  "crates/fl-semantic",
  "crates/fl-workflow",
  "crates/fl-collab",
  "crates/fl-policy",
  "crates/fl-bridge-git",
  "crates/fl-core",
  "crates/fl-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Chris-Cullins/flock"
homepage = "https://github.com/Chris-Cullins/flock"
description = "A next-generation version control system designed for AI agents"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
clap_complete = "4.5"
colored = "2"
criterion = "0.5"
diffy = "0.4"
ed25519-dalek = "2.1"
getrandom = "0.2"
fs2 = "0.4"
flate2 = "1.0"
glob = "0.3"
hex = "0.4"
ignore = "0.4"
rand = "0.8"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tempfile = "3.17"
tree-sitter = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
walkdir = "2.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
